<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us — Mo/Pelwatta Navodya Secondary College</title>
<link rel="icon" href="images/crest.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container breadcrumb" id="breadcrumb"></div>
  <div class="container page-hero">
    <h1 id="page-title"></h1>
    <p id="page-intro"></p>
  </div>

  <section class="section container">
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap:24px; margin-bottom:32px;">
      <!-- Direct Email Card -->
      <div class="card" style="padding:24px; display:flex; flex-direction:column; justify-content:space-between;">
        <div>
          <div style="font-size:2rem; margin-bottom:8px;">✉️</div>
          <h2 id="email-card-title" style="margin-top:0; font-size:1.3rem; border:none; padding:0; color:var(--maroon);"></h2>
          <p id="email-card-desc" style="color:var(--muted); font-size:0.95rem; margin-bottom:16px;"></p>
          <div style="background:var(--maroon-subtle); padding:12px 16px; border-radius:8px; margin-bottom:18px;">
            <div style="font-size:0.8rem; color:var(--muted); font-weight:700;">OFFICIAL INBOX</div>
            <a id="email-link" href="mailto:info@pelwattanavodya.lk" style="font-weight:700; font-size:1.05rem; color:var(--maroon); word-break:break-all;">info@pelwattanavodya.lk</a>
          </div>
        </div>
        <a id="email-btn" href="mailto:info@pelwattanavodya.lk?subject=School%20Inquiry%20-%20Mo/Pelwatta%20Navodya%20College" class="btn" style="text-align:center;"></a>
      </div>

      <!-- Telephone Inquiries Card -->
      <div class="card" style="padding:24px; display:flex; flex-direction:column; justify-content:space-between;">
        <div>
          <div style="font-size:2rem; margin-bottom:8px;">📞</div>
          <h2 id="phone-card-title" style="margin-top:0; font-size:1.3rem; border:none; padding:0; color:var(--maroon);"></h2>
          <p id="phone-card-desc" style="color:var(--muted); font-size:0.95rem; margin-bottom:16px;"></p>
          <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
            <div style="background:var(--gold-subtle); padding:12px 16px; border-radius:8px;">
              <div style="font-size:0.8rem; color:var(--gold-dark); font-weight:700;">PRINCIPAL & OFFICE DIRECT</div>
              <a id="phone-link-1" href="tel:+94552276234" style="font-weight:800; font-size:1.2rem; color:var(--text);">+94 55 227 6234</a>
            </div>
            <div style="background:var(--bg); padding:10px 16px; border-radius:8px; border:1px solid var(--border);">
              <div style="font-size:0.8rem; color:var(--muted); font-weight:700;">ADMINISTRATION DESK</div>
              <a id="phone-link-2" href="tel:+94552276235" style="font-weight:700; font-size:1.05rem; color:var(--text);">+94 55 227 6235</a>
            </div>
          </div>
        </div>
        <div style="font-size:0.85rem; color:var(--muted);" id="office-hours-banner"></div>
      </div>
    </div>

    <!-- Details & Location Grid -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap:24px;">
      <div class="card" style="padding:24px;">
        <h2 id="details-title" style="font-size:1.3rem; margin-top:0;"></h2>
        <div style="display:flex; flex-direction:column; gap:14px; font-size:0.95rem;">
          <p style="margin:0;"><strong>📍 <span id="label-address"></span>:</strong><br><span id="detail-address"></span></p>
          <p style="margin:0;"><strong>🕒 <span id="office-hours-title"></span>:</strong><br><span id="office-hours"></span></p>
          <p style="margin:0;"><strong>⚖️ <span id="rti-label"></span>:</strong><br><span id="rti-name"></span></p>
          <p style="margin:0;"><strong>🏛️ Census ID:</strong> 18452 · Ministry of Education Sri Lanka</p>
        </div>
      </div>

      <div class="card" style="padding:24px;">
        <h2 id="location-title" style="font-size:1.3rem; margin-top:0;"></h2>
        <div class="map-embed"><iframe id="map-iframe" loading="lazy" title="School Location Map"></iframe></div>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
function renderBody(page, common){
  const lang = getLang();
  document.getElementById('breadcrumb').innerHTML = `<a href="index.html">${t(common.nav.home)}</a> / <span>${t(common.nav.contact)}</span>`;
  document.getElementById('page-title').textContent = t(common.nav.contact);
  document.getElementById('page-intro').textContent = t(page.intro);

  // Email Card
  const s = SITE.settings || {};
  const emailVal = s.email || page.email;
  const phone1 = (s.phones && s.phones[0]) || page.phone;
  const phone2 = (s.phones && s.phones[1]) || page.phoneSecondary || phone1;
  const mapUrl = (s.googleMaps && s.googleMaps.embedUrl) || page.mapEmbedUrl;
  const addressText = t((s.address) || common.location);
  const hoursText = t((s.officeHours) || page.officeHours);
  const rtiText = (s.rtiOfficer && s.rtiOfficer.name) ? t(s.rtiOfficer.name) : page.rtiOfficerName;

  document.getElementById('email-card-title').textContent = t(page.emailUsTitle);
  document.getElementById('email-card-desc').textContent = t(page.emailUsDesc);
  document.getElementById('email-btn').textContent = t(page.emailButton);
  document.getElementById('email-link').textContent = emailVal;
  document.getElementById('email-link').href = `mailto:${emailVal}`;
  document.getElementById('email-btn').href = `mailto:${emailVal}?subject=School%20Inquiry%20-%20Mo/Pelwatta%20Navodya%20College`;

  // Phone Card
  document.getElementById('phone-card-title').textContent = t(page.callUsTitle);
  document.getElementById('phone-card-desc').textContent = t(page.callUsDesc);
  document.getElementById('phone-link-1').textContent = phone1;
  document.getElementById('phone-link-1').href = `tel:${phone1.replace(/[^0-9+]/g, '')}`;
  document.getElementById('phone-link-2').textContent = phone2;
  document.getElementById('phone-link-2').href = `tel:${phone2.replace(/[^0-9+]/g, '')}`;
  document.getElementById('office-hours-banner').innerHTML = `🕒 <strong>${t(page.officeHoursTitle)}:</strong> ${hoursText}`;

  // Details
  const detailsHead = lang === 'en' ? 'School Administrative Details' : (lang === 'ta' ? 'பாடசாலை நிர்வாக விபரங்கள்' : 'පාසල් පරිපාලන විස්තර');
  const locHead = lang === 'en' ? 'Campus Location' : (lang === 'ta' ? 'பாடசாலை அமைவிடம்' : 'පාසල් පිහිටීම');
  const addrLabel = lang === 'en' ? 'Address' : (lang === 'ta' ? 'முகவரி' : 'ලිපිනය');
  document.getElementById('details-title').textContent = detailsHead;
  document.getElementById('location-title').textContent = locHead;
  document.getElementById('label-address').textContent = addrLabel;
  document.getElementById('detail-address').textContent = addressText;
  document.getElementById('office-hours-title').textContent = t(page.officeHoursTitle);
  document.getElementById('office-hours').textContent = hoursText;
  document.getElementById('rti-label').textContent = t(page.rtiTitle);
  document.getElementById('rti-name').textContent = rtiText;
  document.getElementById('map-iframe').src = mapUrl;
}
initPage('contact', 'content/pages/contact.json', renderBody);
</script>
</body>
</html>
