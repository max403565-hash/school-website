<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us — Mo/Pelwatta Navodya Secondary Collage</title>
<link rel="icon" href="images/crest-placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container breadcrumb" id="breadcrumb"></div>
  <div class="container page-hero">
    <h1 id="page-title"></h1>
    <p id="page-intro"></p>
  </div>

  <section class="section container" style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
    <div>
      <h2 id="details-title"></h2>
      <p>📍 <span id="detail-address"></span></p>
      <p>📞 <span id="detail-phone"></span></p>
      <p>✉️ <span id="detail-email"></span></p>
      <p><strong id="office-hours-title"></strong>: <span id="office-hours"></span></p>
      <p><strong id="rti-label"></strong>: <span id="rti-name"></span></p>
      <div class="map-embed" style="margin-top:16px"><iframe id="map-iframe" loading="lazy"></iframe></div>
    </div>
    <div>
      <h2 id="form-title"></h2>
      <div id="form-embed-area"></div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
function renderDemoForm(page){
  const f = page.formFields;
  return `
    <div class="notice-box info">${t(page.embedNotSetUpNotice)}</div>
    <form class="form-card" id="contact-form">
      <div class="form-row"><label>${t(f.name)} *</label><input required></div>
      <div class="form-row"><label>${t(f.email)} *</label><input type="email" required></div>
      <div class="form-row"><label>${t(f.subject)} *</label><input required></div>
      <div class="form-row"><label>${t(f.message)} *</label><textarea rows="5" required></textarea></div>
      <button class="btn" type="submit">${t(page.submitLabel)}</button>
      <div class="form-success" id="contact-success" style="display:none;margin-top:16px"></div>
    </form>`;
}
function renderBody(page, common){
  document.getElementById('breadcrumb').innerHTML = `${t(common.nav.home)} / ${t(common.nav.contact)}`;
  document.getElementById('page-title').textContent = t(common.nav.contact);
  document.getElementById('page-intro').textContent = t(page.intro);
  document.getElementById('details-title').textContent = getLang()==='en'?'School Details':(getLang()==='ta'?'பள்ளி விவரங்கள்':'පාසල් විස්තර');
  document.getElementById('detail-address').textContent = t(common.location);
  document.getElementById('detail-phone').textContent = page.phone;
  document.getElementById('detail-email').textContent = page.email;
  document.getElementById('office-hours-title').textContent = t(page.officeHoursTitle);
  document.getElementById('office-hours').textContent = t(page.officeHours);
  document.getElementById('rti-label').textContent = t(common.footer.rti);
  document.getElementById('rti-name').textContent = page.rtiOfficerName;
  document.getElementById('map-iframe').src = page.mapEmbedUrl;
  document.getElementById('form-title').textContent = t(page.formTitle);

  const area = document.getElementById('form-embed-area');
  if (page.googleFormEmbedUrl){
    area.innerHTML = `<iframe src="${page.googleFormEmbedUrl}" width="100%" height="700" style="border:0">Loading…</iframe>`;
  } else {
    area.innerHTML = renderDemoForm(page);
    document.getElementById('contact-form').onsubmit = (e)=>{
      e.preventDefault();
      const box = document.getElementById('contact-success');
      box.style.display = 'block';
      box.textContent = t(page.successMsg);
      e.target.querySelectorAll('input,textarea').forEach(el=>el.disabled=true);
    };
  }
}
initPage('contact', 'content/pages/contact.json', renderBody);
</script>
</body>
</html>
