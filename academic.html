<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic — Mo/Pelwatta Navodya Secondary Collage</title>
<link rel="icon" href="images/crest-placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container breadcrumb" id="breadcrumb"></div>
  <div class="container page-hero">
    <h1 id="page-title"></h1>
    <p id="page-intro"></p>
  </div>

  <section class="section container">
    <div class="card-grid" id="sections-grid"></div>
  </section>

  <section class="section container">
    <h2 id="results-title"></h2>
    <div id="results-list"></div>
  </section>

  <section class="section container">
    <h2 id="downloads-title"></h2>
    <ul id="downloads-list" style="list-style:none;padding:0"></ul>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
function renderBody(page, common){
  document.getElementById('breadcrumb').innerHTML = `${t(common.nav.home)} / ${t(common.nav.academic)}`;
  document.getElementById('page-title').textContent = t(common.nav.academic);
  document.getElementById('page-intro').textContent = t(page.intro);
  document.getElementById('sections-grid').innerHTML = page.sections.map(s=>
    `<div class="card"><div class="body"><h3>${t(s.title)}</h3><p>${t(s.body)}</p></div></div>`
  ).join('');
  document.getElementById('results-title').textContent = t(page.resultsTitle);
  document.getElementById('results-list').innerHTML = page.results.map(r=>
    `<div class="notice-box info"><strong>${r.year}</strong> — ${t(r.text)}</div>`
  ).join('');
  document.getElementById('downloads-title').textContent = t(page.downloadsTitle);
  document.getElementById('downloads-list').innerHTML = page.downloads.map(d=>
    `<li style="padding:10px 0;border-bottom:1px solid var(--border)"><a href="${d.file}" download>&#128190; ${t(d.label)}</a></li>`
  ).join('');
}
initPage('academic', 'content/pages/academic.json', renderBody);
</script>
</body>
</html>
