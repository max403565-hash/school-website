<!DOCTYPE html>
<html lang="si" class="lang-si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Detail | පුවත් විස්තරය - Mo/Pelwatta Navodya Secondary College</title>
  <meta name="description" content="Official school news announcement and details." />
  
  <meta property="og:type" content="article" />
  <meta property="og:title" id="og-title" content="News - Mo/Pelwatta Navodya Secondary College" />
  <meta property="og:description" id="og-desc" content="Official school news article." />
  <meta property="og:image" id="og-img" content="images/campus-hero.jpg" />

  <link rel="icon" type="image/svg+xml" href="images/crest.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header Root -->
  <div id="site-header-root"></div>

  <!-- Page Banner -->
  <section class="page-banner">
    <div class="container">
      <div class="breadcrumbs">
        <a href="index.html" data-i18n="nav.home">Home</a> &gt; 
        <a href="news.html" data-i18n="nav.news">News & Events</a> &gt; 
        <span id="breadcrumb-current">Article</span>
      </div>
      <h1 class="page-title" id="article-title" style="margin-top: 1rem; max-width: 900px; margin-left: auto; margin-right: auto; line-height: 1.3;">
        පුවත පූරණය වෙමින් පවතී...
      </h1>
      <div style="font-size: 0.875rem; color: var(--gold-light); margin-top: 0.75rem;">
        <span id="article-date"></span> · <span id="article-category" style="text-transform: capitalize;"></span>
      </div>
    </div>
  </section>

  <main class="container" style="padding: 3.5rem 1rem; max-width: 860px;">
    <!-- Article Back Link -->
    <div style="margin-bottom: 2rem;">
      <a href="news.html" class="tile-link" style="font-size: 0.9375rem;">
        &larr; <span data-i18n="nav.news">නැවත පුවත් ලැයිස්තුවට (Back to all news)</span>
      </a>
    </div>

    <!-- Article Featured Image -->
    <div style="margin-bottom: 2rem; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md);">
      <img src="" alt="" id="article-img" style="width: 100%; aspect-ratio: 16/9; object-fit: cover;" />
    </div>

    <!-- Article Body -->
    <article class="form-card" style="padding: 2.5rem 2rem; font-size: 1.1rem; line-height: 1.8; color: var(--navy);" id="article-paragraphs">
    </article>

    <!-- Social Share Strip -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
      <div style="font-weight: 700; color: var(--navy); font-size: 0.875rem;">
        මෙම නිවේදනය බෙදාහරින්න (Share this notice):
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn-secondary" style="color:var(--navy); border-color:var(--border); padding:0.4rem 0.8rem; font-size:0.8125rem;" id="btn-copy-link">
          🔗 Copy Link
        </button>
        <button type="button" class="btn-secondary" style="color:var(--navy); border-color:var(--border); padding:0.4rem 0.8rem; font-size:0.8125rem;" id="btn-share-whatsapp">
          💬 WhatsApp
        </button>
      </div>
    </div>
  </main>

  <!-- Footer Root -->
  <div id="site-footer-root"></div>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      let articleData = null;

      function getArticleId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('id') || 'news-1';
      }

      async function loadArticle() {
        const id = getArticleId();
        try {
          if (window.i18n && window.i18n.fetchJSON) {
            articleData = await window.i18n.fetchJSON(`content/news/${id}.json`);
          } else {
            const res = await fetch(`content/news/${id}.json`);
            if (!res.ok) throw new Error("Article not found");
            articleData = await res.json();
          }
          renderArticle();
        } catch (e) {
          console.error("Failed to load article:", e);
          document.getElementById('article-title').textContent = "පුවත සොයාගත නොහැකි විය (Article Not Found)";
          document.getElementById('article-paragraphs').innerHTML = `
            <p style="color:var(--text-muted);">
              ඔබ සොයන පුවත ඉවත් කර හෝ වෙනත් ස්ථානයකට ගෙන ගොස් තිබිය හැක. කරුණාකර ප්‍රධාන පුවත් ලැයිස්තුව පරික්ෂා කරන්න.
            </p>
          `;
        }
      }

      function renderArticle() {
        if (!articleData) return;
        const lang = window.i18n ? window.i18n.getLanguage() : 'si';
        const pick = window.i18n ? window.i18n.pickLang : (o => (o && o[lang]) || '');

        const cleanTitle = pick(articleData.title, lang);
        document.title = `${cleanTitle} - Mo/Pelwatta Navodya Secondary College`;
        document.getElementById('article-title').textContent = cleanTitle;
        document.getElementById('breadcrumb-current').textContent = cleanTitle;
        document.getElementById('article-date').textContent = `📅 ${articleData.date}`;
        document.getElementById('article-category').textContent = articleData.category;
        
        const img = document.getElementById('article-img');
        img.src = (articleData.image || '').replace(/^\/+/, '');
        img.alt = cleanTitle;

        const bodyContainer = document.getElementById('article-paragraphs');
        bodyContainer.innerHTML = (articleData.content || []).map(p => {
          const rawP = pick(p, lang);
          return `<p style="margin-bottom: 1.5rem;">${rawP}</p>`;
        }).join('');

        setupShareButtons(cleanTitle);
      }

      function setupShareButtons(title) {
        const copyBtn = document.getElementById('btn-copy-link');
        const waBtn = document.getElementById('btn-share-whatsapp');
        const currentUrl = window.location.href;

        if (copyBtn) {
          copyBtn.onclick = () => {
            if (navigator.clipboard) {
              navigator.clipboard.writeText(currentUrl).then(() => {
                copyBtn.textContent = '✅ Copied!';
                setTimeout(() => { copyBtn.textContent = '🔗 Copy Link'; }, 2000);
              });
            }
          };
        }

        if (waBtn) {
          waBtn.onclick = () => {
            const text = encodeURIComponent(`${title} - Mo/Pelwatta Navodya Secondary College\n${currentUrl}`);
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
          };
        }
      }

      if (window.i18n && window.i18n.onLanguageChange) {
        window.i18n.onLanguageChange(renderArticle);
      }

      loadArticle();
    })();
  </script>
</body>
</html>
