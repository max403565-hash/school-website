<!DOCTYPE html>
<html lang="si" class="lang-si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Detail | පුවත් විස්තරය - Mo/Pelwatta Navodya Secondary College</title>
  <meta name="description" content="Detailed article from Mo/Pelwatta Navodya Secondary College." />
  
  <meta property="og:type" content="article" />
  <meta property="og:title" id="og-title" content="News - Mo/Pelwatta Navodya Secondary College" />
  <meta property="og:description" id="og-desc" content="Official school news article." />
  <meta property="og:image" id="og-img" content="/images/campus-hero.jpg" />

  <link rel="icon" type="image/svg+xml" href="/images/crest.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Header Root -->
  <div id="site-header-root"></div>

  <!-- Page Header Banner -->
  <div class="page-header-banner">
    <div class="container">
      <div class="breadcrumbs">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <span>/</span>
        <a href="news.html" data-i18n="nav.news">News & Events</a>
        <span>/</span>
        <span id="breadcrumb-current">පුවත් විස්තරය</span>
      </div>
      <h1 class="page-banner-title" id="article-title" style="font-size: 1.85rem; max-width: 54rem;">
        පුවත් තොරතුරු ලබාගනිමින් පවතී...
      </h1>
      <div style="display: flex; align-items: center; gap: 1rem; margin-top: 0.75rem; color: #CBD5E1; font-size: 0.875rem;">
        <span id="article-date">📅 2026</span>
        <span>·</span>
        <span id="article-category" style="text-transform: capitalize; color: #FCD34D;">Academic</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container" style="padding-top: 3.5rem; padding-bottom: 4rem; max-width: 860px;">
    <!-- Back Button -->
    <div style="margin-bottom: 2rem;">
      <a href="news.html" class="tile-link" style="font-size: 0.9375rem;">
        &larr; <span data-i18n="common.backToNews">පුවත් පිටුවට ආපසු (Back to News)</span>
      </a>
    </div>

    <!-- Article Hero Image -->
    <div style="border-radius: var(--radius-md); overflow: hidden; margin-bottom: 2.5rem; box-shadow: var(--shadow-md); border: 1px solid var(--border);">
      <img src="" alt="" id="article-img" style="width: 100%; aspect-ratio: 16/9; object-fit: cover;" />
    </div>

    <!-- Article Content -->
    <article style="font-size: 1.125rem; line-height: 1.85; color: var(--text-main); margin-bottom: 3rem;" id="article-paragraphs">
      <!-- Populated by JS -->
    </article>

    <!-- Social Share Buttons -->
    <div style="background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
      <div>
        <span style="font-weight: 700; color: var(--navy);" data-i18n="common.share">මෙම පුවත බෙදාගන්න (Share):</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button type="button" class="btn-secondary" id="btn-share-copy" style="color:var(--navy); padding:0.4rem 0.875rem; font-size:0.8125rem;">
          📋 <span id="copy-btn-label">Copy Link</span>
        </button>
        <button type="button" class="btn-secondary" id="btn-share-whatsapp" style="color:#16A34A; padding:0.4rem 0.875rem; font-size:0.8125rem;">
          💬 WhatsApp
        </button>
        <button type="button" class="btn-secondary" id="btn-share-facebook" style="color:#2563EB; padding:0.4rem 0.875rem; font-size:0.8125rem;">
          🌐 Facebook
        </button>
      </div>
    </div>
  </main>

  <!-- Footer Root -->
  <div id="site-footer-root"></div>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (function () {
      let articleData = null;

      function getArticleId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('id') || 'news-1';
      }

      async function loadArticle() {
        const id = getArticleId();
        try {
          if (window.i18n && window.i18n.fetchJSON) {
            articleData = await window.i18n.fetchJSON(`content/news/${id}.json`);
          } else {
            const res = await fetch(`/content/news/${id}.json`);
            if (!res.ok) throw new Error("Article not found");
            articleData = await res.json();
          }
          if (!articleData) throw new Error("Article not found");
          renderArticle();
          if (window.i18n && window.i18n.triggerRender) {
            window.i18n.triggerRender();
          }
        } catch (e) {
          console.error("Error loading article:", e);
          document.getElementById('article-title').textContent = "පුවත සොයාගත නොහැකි විය (Article Not Found)";
          document.getElementById('article-paragraphs').innerHTML = `
            <p>ඉල්ලුම් කරන ලද පුවත් වාර්තාව සොයාගත නොහැකි විය. කරුණාකර නැවත උත්සාහ කරන්න.</p>
          `;
        }
      }

      function renderArticle(forcedLang) {
        if (!articleData) return;
        const lang = window.i18n ? window.i18n.resolveLang(forcedLang) : 'si';
        const pick = window.i18n ? window.i18n.pickLang : (o => (o && o[lang]) || '');

        const titleText = pick(articleData.title, lang);
        document.title = `${titleText} - Mo/Pelwatta Navodya Secondary College`;
        document.getElementById('article-title').textContent = titleText;
        document.getElementById('breadcrumb-current').textContent = titleText;
        document.getElementById('article-date').textContent = `📅 ${articleData.date}`;
        document.getElementById('article-category').textContent = articleData.category;
        
        const img = document.getElementById('article-img');
        img.src = articleData.image;
        img.alt = titleText;

        const bodyContainer = document.getElementById('article-paragraphs');
        bodyContainer.innerHTML = articleData.content.map(p => `
          <p style="margin-bottom: 1.5rem;">${pick(p, lang)}</p>
        `).join('');

        setupShareButtons(titleText);
      }

      function setupShareButtons(title) {
        const url = window.location.href;

        document.getElementById('btn-share-copy').onclick = () => {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(() => {
              const btn = document.getElementById('copy-btn-label');
              const original = btn.textContent;
              btn.textContent = "Copied! ✓";
              setTimeout(() => { btn.textContent = original; }, 2000);
            });
          }
        };

        document.getElementById('btn-share-whatsapp').onclick = () => {
          const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(title + ' - ' + url)}`;
          const link = document.createElement('a');
          link.href = waUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.click();
        };

        document.getElementById('btn-share-facebook').onclick = () => {
          const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
          const link = document.createElement('a');
          link.href = fbUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.click();
        };
      }

      if (window.i18n && window.i18n.registerPageRenderer) {
        window.i18n.registerPageRenderer(renderArticle);
      }
      window.addEventListener('languageChanged', (e) => renderArticle(e.detail && e.detail.lang));
      if (window.i18n && window.i18n.whenReady) {
        window.i18n.whenReady().then(() => renderArticle());
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadArticle);
      } else {
        loadArticle();
      }
    })();
  </script>
</body>
</html>
