<!--
  =============================================================================
  MO/PELWATTA NAVODYA SECONDARY COLLEGE — ADMISSIONS APPLICATION SETUP GUIDE
  =============================================================================
  School staff must complete these one-time manual steps to connect this form:

  (a) CREATE A GOOGLE FORM:
      Go to forms.google.com and create a new Google Form titled "Student Admissions".
      Add questions matching these exact fields:
      1. Student's Full Name (Short answer)
      2. Date of Birth (Date or Short answer)
      3. Gender (Multiple choice or Short answer: M / F)
      4. Grade Applying For (Short answer)
      5. Parent / Guardian Name (Short answer)
      6. Phone Number (Short answer)
      7. Email Address (Short answer)
      8. Permanent Address (Paragraph)
      9. Reference Number (Short answer, optional)

  (b) GET EACH FIELD'S ENTRY ID VIA "Get pre-filled link":
      In your Google Form editor, click the three dots icon (top-right) -> "Get pre-filled link".
      Type sample test data into each field, then click "Get link" at the bottom -> click "Copy link".

  (c) PASTE THOSE IDs INTO THE PLACEHOLDERS IN THIS FILE:
      Open the copied link in a text editor:
      - The Form ID is the long string between "/d/e/" and "/viewform".
      - Each field's parameter starts with "entry.XXXXXXXXXX=".
      Update the placeholder constants in the <script> below:
      - GOOGLE_FORM_ID = "YOUR_REAL_FORM_ID"
      - GOOGLE_FORM_ENTRIES.studentName = "entry.XXXXXXXXXX"
      - ... (match each field's entry ID).

  (d) PUBLISH CONNECTED GOOGLE SHEET TO WEB & PASTE INTO ADMIN PANEL:
      In your Google Form, open the "Responses" tab and click "Link to Sheets".
      In the connected Google Sheet:
      Click File -> Share -> "Publish to web".
      Under "Link", select "Entire Document" (or "Form Responses 1") and choose "Comma-separated values (.csv)".
      Click "Publish" and copy that CSV link.
      Open the admin panel (/xk92m-manage/index.html) -> click the "Applications" tab,
      paste the CSV link into the setting field, and click "Save Link".
  =============================================================================
-->
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admissions — Mo/Pelwatta Navodya Secondary College</title>
<link rel="icon" href="images/crest.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container breadcrumb" id="breadcrumb"></div>
  <div class="container page-hero">
    <h1 id="page-title"></h1>
    <p id="page-intro"></p>
  </div>

  <section class="container">
    <div class="notice-box" id="free-notice"></div>
    <div class="notice-box warn" id="admin-tool-notice"></div>
  </section>

  <section class="section container" id="form-section">
    <div id="form-embed-area"></div>
  </section>

  <section class="section container">
    <h2 id="faq-title"></h2>
    <div class="faq" id="faq-list"></div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
// =============================================================================
// GOOGLE FORM SUBMISSION CONFIGURATION
// =============================================================================
const GOOGLE_FORM_ID = '1FAIpQLSdgIyw0gj49Ljrr36KQYWYjjR0Zxa5L6gwgTSXRRwAbnwbdgA';

const GOOGLE_FORM_ENTRIES = {
  studentName: 'entry.1432907719',
  dob:         'entry.1108585059',
  gender:      'entry.1713704593',
  grade:       'entry.1870348017',
  parentName:  'entry.476165141',
  phone:       'entry.791239928',
  email:       'entry.1210606851',
  address:     'entry.368470239'
};

function refNumber(){
  const y = new Date().getFullYear();
  const n = Math.floor(100000 + Math.random()*900000);
  return `PEL-${y}-${n}`;
}

function renderAdmissionForm(page, common){
  const f = page.formFields;
  return `
    <form class="form-card" id="admission-form">
      <div class="form-row">
        <label for="adm-student-name">${t(f.studentName)} *</label>
        <input type="text" id="adm-student-name" required>
      </div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div>
          <label for="adm-dob">${t(f.dob)} *</label>
          <input type="date" id="adm-dob" required>
        </div>
        <div>
          <label for="adm-gender">${t(f.gender)} *</label>
          <select id="adm-gender" required>
            <option value=""></option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label for="adm-grade">${t(f.grade)} *</label>
        <input type="text" id="adm-grade" required>
      </div>
      <div class="form-row">
        <label for="adm-parent-name">${t(f.parentName)} *</label>
        <input type="text" id="adm-parent-name" required>
      </div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div>
          <label for="adm-phone">${t(f.phone)} *</label>
          <input type="tel" id="adm-phone" required>
        </div>
        <div>
          <label for="adm-email">${t(f.email)} *</label>
          <input type="email" id="adm-email" required>
        </div>
      </div>
      <div class="form-row">
        <label for="adm-address">${t(f.address)} *</label>
        <textarea id="adm-address" rows="3" required></textarea>
      </div>
      <div class="form-row checkbox">
        <input type="checkbox" required id="consent-check">
        <label for="consent-check" style="font-weight:400">${t(page.consentLabel)}</label>
      </div>
      <button class="btn" type="submit" id="adm-submit-btn">${t(page.submitLabel)}</button>
      <div class="form-success" id="admission-success" style="display:none;margin-top:16px"></div>
    </form>
  `;
}

function renderBody(page, common){
  document.getElementById('breadcrumb').innerHTML = `${t(common.nav.home)} / ${t(common.nav.admissions)}`;
  document.getElementById('page-title').textContent = t(common.nav.admissions);
  document.getElementById('page-intro').textContent = t(page.intro);
  document.getElementById('free-notice').textContent = t(page.freeNotice);
  document.getElementById('admin-tool-notice').textContent = t(page.adminToolNotice);
  document.getElementById('faq-title').textContent = t(page.faqTitle);
  document.getElementById('faq-list').innerHTML = page.faqs.map(f=>
    `<details><summary>${t(f.q)}</summary><p>${t(f.a)}</p></details>`
  ).join('');

  const area = document.getElementById('form-embed-area');
  area.innerHTML = renderAdmissionForm(page, common);

  const form = document.getElementById('admission-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('adm-submit-btn');
    const box = document.getElementById('admission-success');
    const originalBtnText = btn.textContent;
    btn.disabled = true;
    btn.textContent = (getLang() === 'si') ? 'යවමින් පවතී...' : (getLang() === 'ta' ? 'அனுப்பப்படுகிறது...' : 'Submitting...');

    const ref = refNumber();
    const studentName = (document.getElementById('adm-student-name').value || '').trim();
    const dob = (document.getElementById('adm-dob').value || '').trim();
    const rawGender = (document.getElementById('adm-gender').value || '').trim();
    const gender = (rawGender === 'M' || rawGender === 'Male') ? 'Male' : (rawGender === 'F' || rawGender === 'Female' ? 'Female' : rawGender);
    const grade = (document.getElementById('adm-grade').value || '').trim();
    const parentName = (document.getElementById('adm-parent-name').value || '').trim();
    const phone = (document.getElementById('adm-phone').value || '').trim();
    const email = (document.getElementById('adm-email').value || '').trim();
    const address = (document.getElementById('adm-address').value || '').trim();

    // Prepare exact URLSearchParams for Google Form:
    const params = new URLSearchParams();
    params.append('entry.1432907719', studentName);
    params.append('entry.1108585059', dob);
    // Also include year/month/day in case the Google Form uses split date components
    const dobParts = dob.split('-');
    if (dobParts.length === 3) {
      params.append('entry.1108585059_year', dobParts[0]);
      params.append('entry.1108585059_month', dobParts[1]);
      params.append('entry.1108585059_day', dobParts[2]);
    }
    params.append('entry.1713704593', gender);
    params.append('entry.1870348017', grade);
    params.append('entry.476165141', parentName);
    params.append('entry.791239928', phone);
    params.append('entry.1210606851', email);
    params.append('entry.368470239', address);

    const primaryUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSdgIyw0gj49Ljrr36KQYWYjjR0Zxa5L6gwgTSXRRwAbnwbdgA/formResponse';
    const directUrl  = 'https://docs.google.com/forms/d/e/1FAIpQLSdgIyw0gj49Ljrr36KQYWYjjR0Zxa5L6gwgTSXRRwAbnwbdgA/formResponse';

    // Temporary console debugging as requested
    console.log("=== [ADMISSIONS FORM SUBMISSION DEBUG] ===");
    console.log("Timestamp:", new Date().toISOString());
    console.log("Target primaryUrl:", primaryUrl);
    console.log("Target directUrl:", directUrl);
    console.log("Extracted Field Values:");
    console.log("  - Student Name (entry.1432907719):", studentName);
    console.log("  - Date of Birth (entry.1108585059):", dob);
    console.log("  - Gender (entry.1713704593):", gender);
    console.log("  - Grade (entry.1870348017):", grade);
    console.log("  - Parent Name (entry.476165141):", parentName);
    console.log("  - Phone (entry.791239928):", phone);
    console.log("  - Email (entry.1210606851):", email);
    console.log("  - Address (entry.368470239):", address);
    console.log("Full URLSearchParams payload string:");
    console.log(params.toString());
    console.log("==========================================");

    try {
      // 1. Background fetch POST request (mode: "no-cors")
      const req1 = fetch(primaryUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: params
      });

      // 2. Also post to directUrl in parallel to guarantee delivery regardless of /e/ route
      const req2 = fetch(directUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: params
      }).catch(() => {});

      // 3. Fallback submission via hidden iframe in case browser tracking prevention blocks cross-origin fetch
      try {
        let iframe = document.getElementById('hidden_gform_iframe');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.id = 'hidden_gform_iframe';
          iframe.name = 'hidden_gform_iframe';
          iframe.style.display = 'none';
          document.body.appendChild(iframe);
        }
        const hiddenForm = document.createElement('form');
        hiddenForm.method = 'POST';
        hiddenForm.action = primaryUrl;
        hiddenForm.target = 'hidden_gform_iframe';
        hiddenForm.style.display = 'none';
        for (const [k, v] of params.entries()) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = k;
          input.value = v;
          hiddenForm.appendChild(input);
        }
        document.body.appendChild(hiddenForm);
        hiddenForm.submit();
        setTimeout(() => { hiddenForm.remove(); }, 1500);
      } catch (frameErr) {
        console.warn("Iframe fallback notice:", frameErr);
      }

      await Promise.all([req1, req2]);

      // Small delay for UI smoothness
      await new Promise(r => setTimeout(r, 600));

      box.style.display = 'block';
      box.className = 'form-success';
      box.innerHTML = `<strong>${t(page.successPrefix)} ${ref}</strong>`;
      form.querySelectorAll('input,select,textarea,button').forEach(el => el.disabled = true);
    } catch (err) {
      console.error("Submission failed:", err);
      btn.disabled = false;
      btn.textContent = originalBtnText;
      box.style.display = 'block';
      box.className = 'notice-box warn';
      box.innerHTML = (getLang() === 'si')
        ? 'සම්බන්ධතා දෝෂයකි. කරුණාකර ඔබගේ අන්තර්ජාල සබඳතාව පරීක්ෂා කර නැවත උත්සාහ කරන්න.'
        : (getLang() === 'ta')
        ? 'இணைப்புப் பிழை. உங்கள் இணைய இணைப்பைச் சரிபார்த்தු மீண்டும் முயற்சிக்கவும்.'
        : 'Network connection error. Please check your internet connection and try again.';
    }
  };
}

initPage('admissions', 'content/pages/admissions.json', renderBody);
</script>
</body>
</html>
