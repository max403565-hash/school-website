<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%" aria-label="School Crest of Mo/Pelwatta Navodya Secondary College">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F284E"/>
      <stop offset="100%" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="crestShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M 160 18 C 240 18, 290 28, 290 90 C 290 230, 220 300, 160 340 C 100 300, 30 230, 30 90 C 30 28, 80 18, 160 18 Z" 
        fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#crestShadow)"/>

  <!-- Inner Gold Border -->
  <path d="M 160 32 C 228 32, 272 40, 272 94 C 272 218, 210 282, 160 320 C 110 282, 48 218, 48 94 C 48 40, 92 32, 160 32 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- Radiant Sun in Top Center -->
  <g transform="translate(160, 80)">
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)"/>
    <path d="M 0 -22 L 0 -17 M 0 22 L 0 17 M -22 0 L -17 0 M 22 0 L 17 0 M -15 -15 L -12 -12 M 15 15 L 12 12 M -15 15 L -12 12 M 15 -15 L 12 -12" 
          stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Traditional Lamp of Wisdom (Pahana) -->
  <g transform="translate(160, 150)">
    <path d="M 0 -42 C -9 -25, -5 -12, 0 -3 C 5 -12, 9 -25, 0 -42 Z" fill="url(#flameGrad)"/>
    <ellipse cx="0" cy="-14" rx="3" ry="8" fill="#FFFFFF" opacity="0.8"/>
    <path d="M -32 0 C -30 18, 30 18, 32 0 C 32 -4, -32 -4, -32 0 Z" fill="url(#goldGrad)"/>
    <ellipse cx="0" cy="0" rx="32" ry="5" fill="#B45309"/>
    <path d="M -7 0 L -5 22 L 5 22 L 7 0 Z" fill="url(#goldGrad)"/>
    <path d="M -22 22 C -20 28, 20 28, 22 22 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Open Book of Knowledge -->
  <g transform="translate(160, 220)">
    <path d="M 0 12 C -24 0, -56 4, -68 12 L -68 -18 C -56 -24, -24 -20, 0 -12 C 24 -20, 56 -24, 68 -18 L 68 12 C 56 4, 24 0, 0 12 Z" 
          fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#B45309" stroke-width="2"/>
    <path d="M -56 -6 Q -35 -10 -10 -4 M -56 2 Q -35 -2 -10 4 M 10 -4 Q 35 -10 56 -6 M 10 4 Q 35 -2 56 2" 
          stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Paddy Sheaves / Grain Wreaths on Sides -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <path d="M 68 220 Q 56 160 76 110"/>
    <ellipse cx="64" cy="190" rx="4" ry="8" fill="url(#goldGrad)" transform="rotate(-30 64 190)"/>
    <ellipse cx="60" cy="165" rx="4" ry="8" fill="url(#goldGrad)" transform="rotate(-35 60 165)"/>
    <ellipse cx="62" cy="140" rx="4" ry="8" fill="url(#goldGrad)" transform="rotate(-40 62 140)"/>
    <ellipse cx="70" cy="120" rx="4" ry="8" fill="url(#goldGrad)" transform="rotate(-45 70 120)"/>
    <path d="M 252 220 Q 264 160 244 110"/>
    <ellipse cx="256" cy="190" rx="4" ry="8" fill="url(#goldGrad)" transform="rotate(30 256 190)"/>
    <ellipse cx="260" cy="165" rx="4" ry="8" fill="url(#goldGrad)" transform="rotate(35 260 165)"/>
    <ellipse cx="258" cy="140" rx="4" ry="8" fill="url(#goldGrad)" transform="rotate(40 258 140)"/>
    <ellipse cx="250" cy="120" rx="4" ry="8" fill="url(#goldGrad)" transform="rotate(45 250 120)"/>
  </g>

  <!-- Motto Banner at Bottom -->
  <g transform="translate(160, 310)">
    <path d="M -130 0 L -110 -14 L -80 -6 L 80 -6 L 110 -14 L 130 0 L 110 14 L 80 8 L -80 8 L -110 14 Z" 
          fill="url(#goldGrad)" stroke="#78350F" stroke-width="1.5" filter="url(#crestShadow)"/>
    <text x="0" y="4" font-family="'Noto Sans Sinhala', 'Noto Sans Tamil', serif, sans-serif" font-size="10.5" font-weight="bold" fill="#0F284E" text-anchor="middle" letter-spacing="0.5">
      විද්‍යා දදාති විනයං · ஒழுக்கம் தரும் கல்வி
    </text>
  </g>
  <text x="160" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="1">
    MO/PELWATTA NAVODYA SECONDARY COLLEGE
  </text>
</svg>
