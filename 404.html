<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found</title>
<link rel="icon" href="images/crest-placeholder.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container" style="padding:80px 0; text-align:center">
  <h1 style="font-size:4rem; color:var(--navy); margin:0">404</h1>
  <p id="msg" style="color:var(--muted); margin:14px 0 24px"></p>
  <a class="btn" href="index.html" id="home-link"></a>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
function renderBody(){
  document.getElementById('msg').textContent = getLang()==='en' ? "The page you're looking for doesn't exist." :
    (getLang()==='ta' ? "நீங்கள் தேடும் பக்கம் இல்லை." : "ඔබ සොයන පිටුව හමු නොවීය.");
  document.getElementById('home-link').textContent = t(SITE.common.nav.home);
}
initPage('404', null, renderBody);
</script>
</body>
</html>
