  <script>
    (function () {
      'use strict';

      let currentPageData = null;
      let activeGalleryImages = [];
      let activeGalleryIndex = 0;

      // Extract query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const slug = (urlParams.get('p') || '').trim();
      const isPreview = urlParams.get('preview') === '1' ||
                        urlParams.get('preview') === 'true' ||
                        Boolean(sessionStorage.getItem('preview_' + slug)) ||
                        Boolean(localStorage.getItem('cpage_preview_' + slug)) ||
                        Boolean(localStorage.getItem('gh_token'));

      function getActiveLanguage() {
        if (window.i18n && window.i18n.getLanguage) {
          return window.i18n.getLanguage();
        }
        return localStorage.getItem('pelwatta_lang') || localStorage.getItem('site_lang') || 'si';
      }

      function pick(obj, lang) {
        if (!obj) return '';
        if (typeof obj === 'string') return obj;
        return obj[lang] || obj['si'] || obj['en'] || '';
      }

      function isSafeUrl(url) {
        if (!url || typeof url !== 'string') return false;
        const trimmed = url.trim();
        // Allow http:, https:
        if (trimmed.startsWith('https://') || trimmed.startsWith('http://')) {
          return true;
        }
        // Relative url: cannot start with // and cannot contain scheme before slash
        if (trimmed.startsWith('//')) return false;
        const colonIndex = trimmed.indexOf(':');
        if (colonIndex !== -1) {
          const slashIndex = trimmed.indexOf('/');
          if (slashIndex === -1 || colonIndex < slashIndex) {
            return false; // Reject javascript:, data:, etc.
          }
        }
        return true;
      }

      const EMBED_WHITELIST_HOSTS = [
        'facebook.com/plugins',
        'www.facebook.com/plugins',
        'youtube.com/embed',
        'www.youtube.com/embed',
        'google.com/maps/embed',
        'www.google.com/maps/embed'
      ];

      function isWhitelistedEmbed(url) {
        if (!url || typeof url !== 'string') return false;
        try {
          const parsed = new URL(url, window.location.href);
          if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return false;
          const hostAndPath = (parsed.hostname + parsed.pathname).toLowerCase();
          return EMBED_WHITELIST_HOSTS.some(allowed => hostAndPath.includes(allowed.toLowerCase()));
        } catch (e) {
          return false;
        }
      }

      // Safe markdown parsing using textContent & DOM nodes only
      function renderMarkdownInto(textStr, container) {
        if (!textStr) return;
        const paragraphs = textStr.split(/\n\s*\n/);
        paragraphs.forEach(paraText => {
          const trimmed = paraText.trim();
          if (!trimmed) return;
          const p = document.createElement('p');
          p.className = 'page-paragraph';

          // Tokenize bold **text** and link [label](url)
          const tokenRegex = /(\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\))/g;
          let lastIndex = 0;
          let match;

          while ((match = tokenRegex.exec(trimmed)) !== null) {
            if (match.index > lastIndex) {
              p.appendChild(document.createTextNode(trimmed.substring(lastIndex, match.index)));
            }

            const token = match[0];
            if (token.startsWith('**') && token.endsWith('**')) {
              const strong = document.createElement('strong');
              strong.textContent = token.slice(2, -2);
              p.appendChild(strong);
            } else if (token.startsWith('[') && token.includes('](') && token.endsWith(')')) {
              const mid = token.indexOf('](');
              const label = token.substring(1, mid);
              const linkUrl = token.substring(mid + 2, token.length - 1).trim();

              if (isSafeUrl(linkUrl)) {
                const a = document.createElement('a');
                a.textContent = label;
                a.setAttribute('href', linkUrl);
                if (linkUrl.startsWith('http://') || linkUrl.startsWith('https://')) {
                  a.setAttribute('target', '_blank');
                  a.setAttribute('rel', 'noopener noreferrer');
                }
                p.appendChild(a);
              } else {
                p.appendChild(document.createTextNode(label));
              }
            }

            lastIndex = tokenRegex.lastIndex;
          }

          if (lastIndex < trimmed.length) {
            p.appendChild(document.createTextNode(trimmed.substring(lastIndex)));
          }

          container.appendChild(p);
        });
      }

      // Render Friendly Not Found
      function showNotFound(reasonKey) {
        const lang = getActiveLanguage();
        const heroContainer = document.getElementById('page-hero-container');
        if (heroContainer) heroContainer.style.display = 'none';

        const mainContainer = document.getElementById('blocks-render-root');
        if (!mainContainer) return;
        mainContainer.innerHTML = '';

        const card = document.createElement('div');
        card.className = 'not-found-card';

        const icon = document.createElement('div');
        icon.className = 'not-found-icon';
        icon.textContent = '🔍';
        card.appendChild(icon);

        const h = document.createElement('h2');
        h.className = 'not-found-title';

        const p = document.createElement('p');
        p.className = 'not-found-text';

        if (reasonKey === 'missing_slug') {
          h.textContent = lang === 'en' ? 'Page Not Found' : (lang === 'ta' ? 'பக்கம் கிடைக்கவில்லை' : 'පිටුව හමු නොවීය');
          p.textContent = lang === 'en'
            ? 'No page parameter was specified in the link URL. Please choose a valid page from the menu.'
            : (lang === 'ta'
              ? 'பக்க அளவுரு எதுவும் குறிப்பிடப்படவில்லை. மெனுவிலிருந்து சரியான பக்கத்தைத் தேர்ந்தெடுக்கவும்.'
              : 'ලිපිනයේ කිසිදු පිටුවක් (slug) සඳහන් කර නොමැත. කරුණාකර මෙනුවෙන් නිවැරදි පිටුවක් තෝරන්න.');
        } else if (reasonKey === 'unpublished') {
          h.textContent = lang === 'en' ? 'Page Unpublished' : (lang === 'ta' ? 'பக்கம் வெளியிடப்படவில்லை' : 'පිටුව තවමත් ප්‍රකාශයට පත් කර නැත');
          p.textContent = lang === 'en'
            ? 'This custom page is currently unpublished or in draft status. (School staff can preview it by adding &preview=1 to the URL).'
            : (lang === 'ta'
              ? 'இந்த பக்கம் தற்போது வரைவு நிலையில் உள்ளது. (ஊழியர்கள் &preview=1 சேர்த்து முன்னோட்டம் பார்க்கலாம்).'
              : 'මෙම අභිරුචි පිටුව තවමත් ප්‍රකාශයට පත් කර නොමැත. (කාර්ය මණ්ඩලය සඳහා &preview=1 යෙදීමෙන් පෙරදසුන් කළ හැක).');
        } else {
          h.textContent = lang === 'en' ? 'Page Not Found (404)' : (lang === 'ta' ? 'பக்கம் கிடைக்கவில்லை (404)' : 'පිටුව හමු නොවීය (404)');
          p.textContent = lang === 'en'
            ? `The requested custom page "${slug}" does not exist or may have been renamed.`
            : (lang === 'ta'
              ? `கோரப்பட்ட பக்கம் "${slug}" கிடைக்கவில்லை.`
              : `ඔබ සොයන "${slug}" නමැති අභිරුචි පිටුව මෙම පද්ධතියේ නොමැත හෝ මකා දමා ඇත.`);
        }

        card.appendChild(h);
        card.appendChild(p);

        const actions = document.createElement('div');
        actions.className = 'not-found-actions';

        const homeLink = document.createElement('a');
        homeLink.className = 'btn-primary';
        homeLink.setAttribute('href', 'index.html');
        homeLink.textContent = lang === 'en' ? 'Return to Home' : (lang === 'ta' ? 'முகப்புக்குச் செல்க' : 'මුල් පිටුවට පිවිසෙන්න');
        actions.appendChild(homeLink);

        const newsLink = document.createElement('a');
        newsLink.className = 'btn-secondary';
        newsLink.setAttribute('href', 'news.html');
        newsLink.textContent = lang === 'en' ? 'View News' : (lang === 'ta' ? 'செய்திகள்' : 'පුවත් සහ නිවේදන');
        actions.appendChild(newsLink);

        card.appendChild(actions);
        mainContainer.appendChild(card);

        // Document title
        document.title = (lang === 'en' ? 'Page Not Found' : (lang === 'ta' ? 'பக்கம் கிடைக்கவில்லை' : 'පිටුව හමු නොවීය')) + ' | මො/පැල්වත්ත නවෝද්‍යා ද්විතීයික විද්‍යාලය';
      }

      // Render Loaded Custom Page
      function renderPage() {
        if (!currentPageData) return;
        const lang = getActiveLanguage();
        const data = currentPageData;

        // Check published status
        if (data.published !== true && !isPreview) {
          showNotFound('unpublished');
          return;
        }

        const heroContainer = document.getElementById('page-hero-container');
        if (heroContainer) heroContainer.style.display = 'block';

        const pageTitle = pick(data.title, lang) || 'Pelwatta College';
        const pageSubtitle = pick(data.subtitle, lang) || '';

        // Document Title
        document.title = `${pageTitle} | මො/පැල්වත්ත නවෝද්‍යා ද්විතීයික විද්‍යාලය`;

        // Breadcrumb
        const bcTitle = document.getElementById('bc-current-title');
        if (bcTitle) bcTitle.textContent = pageTitle;

        // Hero Titles
        const hTitle = document.getElementById('page-title-elem');
        if (hTitle) hTitle.textContent = pageTitle;

        const hSub = document.getElementById('page-subtitle-elem');
        if (hSub) {
          hSub.textContent = pageSubtitle;
          hSub.style.display = pageSubtitle ? 'block' : 'none';
        }

        const hBadge = document.getElementById('page-badge-elem');
        if (hBadge) {
          hBadge.textContent = lang === 'en' ? 'Official Page' : (lang === 'ta' ? 'அதிகாரப்பூர்வ பக்கம்' : 'නිල පාසල් පිටුව');
        }

        const root = document.getElementById('blocks-render-root');
        if (!root) return;
        root.innerHTML = '';

        // Draft Preview Banner if unpublished but preview mode
        if (data.published !== true && isPreview) {
          const draftBanner = document.createElement('div');
          draftBanner.className = 'page-draft-banner';
          draftBanner.textContent = lang === 'en'
            ? '📝 PREVIEW MODE: This page is currently an UNPUBLISHED DRAFT. Visible only in preview mode.'
            : (lang === 'ta'
              ? '📝 முன்னோட்ட முறை: இந்த பக்கம் இன்னும் வெளியிடப்படவில்லை (வரைவு).'
              : '📝 පෙරදසුන් මාදිලිය: මෙම පිටුව තවමත් ප්‍රකාශයට පත් කර නොමැති කෙටුම්පතකි.');
          root.appendChild(draftBanner);
        }

        // Render each block in order
        const blocks = Array.isArray(data.blocks) ? data.blocks : [];
        blocks.forEach(block => {
          if (!block || typeof block !== 'object') return;

          switch (block.type) {
            case 'heading': {
              const level = Math.min(6, Math.max(1, parseInt(block.level, 10) || 2));
              const h = document.createElement('h' + level);
              h.className = `page-heading page-heading-${level}`;
              h.textContent = pick(block.text, lang);
              root.appendChild(h);
              break;
            }

            case 'text': {
              const textContent = pick(block.content, lang);
              renderMarkdownInto(textContent, root);
              break;
            }

            case 'image': {
              if (block.src && isSafeUrl(block.src)) {
                const figure = document.createElement('figure');
                figure.className = 'page-image-figure';

                const img = document.createElement('img');
                img.setAttribute('src', block.src);
                img.setAttribute('alt', pick(block.alt, lang) || '');
                img.setAttribute('loading', 'lazy');
                img.className = 'page-single-image';
                figure.appendChild(img);

                if (block.caption) {
                  const capText = pick(block.caption, lang);
                  if (capText) {
                    const figcap = document.createElement('figcaption');
                    figcap.className = 'page-image-caption';
                    figcap.textContent = capText;
                    figure.appendChild(figcap);
                  }
                }
                root.appendChild(figure);
              }
              break;
            }

            case 'gallery': {
              if (Array.isArray(block.images) && block.images.length > 0) {
                const galleryDiv = document.createElement('div');
                galleryDiv.className = 'page-gallery-grid';

                block.images.forEach((item, idx) => {
                  if (!item.src || !isSafeUrl(item.src)) return;

                  const figure = document.createElement('figure');
                  figure.className = 'page-gallery-item';

                  const img = document.createElement('img');
                  img.setAttribute('src', item.src);
                  img.setAttribute('alt', pick(item.alt, lang) || '');
                  img.setAttribute('loading', 'lazy');
                  figure.appendChild(img);

                  if (item.caption) {
                    const cText = pick(item.caption, lang);
                    if (cText) {
                      const figcap = document.createElement('figcaption');
                      figcap.className = 'page-gallery-caption';
                      figcap.textContent = cText;
                      figure.appendChild(figcap);
                    }
                  }

                  figure.addEventListener('click', () => {
                    openLightbox(block.images, idx);
                  });

                  galleryDiv.appendChild(figure);
                });

                root.appendChild(galleryDiv);
              }
              break;
            }

            case 'cards': {
              if (Array.isArray(block.items) && block.items.length > 0) {
                const cardsGrid = document.createElement('div');
                cardsGrid.className = 'page-cards-grid';

                block.items.forEach(c => {
                  const card = document.createElement('div');
                  card.className = 'page-card';

                  if (c.image && isSafeUrl(c.image)) {
                    const img = document.createElement('img');
                    img.setAttribute('src', c.image);
                    img.setAttribute('alt', pick(c.title, lang) || '');
                    img.setAttribute('loading', 'lazy');
                    img.className = 'page-card-image';
                    card.appendChild(img);
                  }

                  const body = document.createElement('div');
                  body.className = 'page-card-body';

                  if (c.title) {
                    const title = document.createElement('h3');
                    title.className = 'page-card-title';
                    title.textContent = pick(c.title, lang);
                    body.appendChild(title);
                  }

                  if (c.subtitle) {
                    const sub = document.createElement('div');
                    sub.className = 'page-card-subtitle';
                    sub.textContent = pick(c.subtitle, lang);
                    body.appendChild(sub);
                  }

                  if (c.text) {
                    const txt = document.createElement('p');
                    txt.className = 'page-card-text';
                    txt.textContent = pick(c.text, lang);
                    body.appendChild(txt);
                  }

                  card.appendChild(body);
                  cardsGrid.appendChild(card);
                });

                root.appendChild(cardsGrid);
              }
              break;
            }

            case 'table': {
              const tableWrap = document.createElement('div');
              tableWrap.className = 'page-table-wrapper';

              const table = document.createElement('table');
              table.className = 'page-table';

              if (Array.isArray(block.columns) && block.columns.length > 0) {
                const thead = document.createElement('thead');
                const tr = document.createElement('tr');
                block.columns.forEach(col => {
                  const th = document.createElement('th');
                  th.textContent = pick(col, lang);
                  tr.appendChild(th);
                });
                thead.appendChild(tr);
                table.appendChild(thead);
              }

              if (Array.isArray(block.rows) && block.rows.length > 0) {
                const tbody = document.createElement('tbody');
                block.rows.forEach(rowArr => {
                  if (!Array.isArray(rowArr)) return;
                  const tr = document.createElement('tr');
                  rowArr.forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = pick(cell, lang);
                    tr.appendChild(td);
                  });
                  tbody.appendChild(tr);
                });
                table.appendChild(tbody);
              }

              tableWrap.appendChild(table);
              root.appendChild(tableWrap);
              break;
            }

            case 'links': {
              if (Array.isArray(block.items) && block.items.length > 0) {
                const list = document.createElement('ul');
                list.className = 'page-links-list';

                block.items.forEach(linkItem => {
                  const li = document.createElement('li');
                  li.className = 'page-link-item';

                  if (isSafeUrl(linkItem.href)) {
                    const a = document.createElement('a');
                    a.setAttribute('href', linkItem.href);
                    a.className = 'page-download-link';

                    const icon = document.createElement('span');
                    icon.className = 'page-link-icon';
                    icon.textContent = (linkItem.href || '').endsWith('.pdf') ? '📄' : '🔗';
                    a.appendChild(icon);

                    const label = document.createElement('span');
                    label.className = 'page-link-text';
                    label.textContent = pick(linkItem.label, lang);
                    a.appendChild(label);

                    if ((linkItem.href || '').startsWith('http://') || (linkItem.href || '').startsWith('https://')) {
                      a.setAttribute('target', '_blank');
                      a.setAttribute('rel', 'noopener noreferrer');
                      const ext = document.createElement('span');
                      ext.className = 'page-link-ext';
                      ext.textContent = ' ↗';
                      a.appendChild(ext);
                    }

                    li.appendChild(a);
                  } else {
                    li.textContent = pick(linkItem.label, lang);
                  }

                  list.appendChild(li);
                });

                root.appendChild(list);
              }
              break;
            }

            case 'embed': {
              const embedWrap = document.createElement('div');
              embedWrap.className = 'page-embed-wrapper';

              if (block.url && isWhitelistedEmbed(block.url)) {
                const iframe = document.createElement('iframe');
                iframe.setAttribute('src', block.url);
                iframe.setAttribute('loading', 'lazy');
                iframe.setAttribute('title', pick(block.caption, lang) || 'Embedded Media');
                iframe.setAttribute('allowfullscreen', 'true');
                iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
                const h = parseInt(block.height, 10) || 400;
                iframe.style.height = `${Math.min(800, Math.max(200, h))}px`;
                embedWrap.appendChild(iframe);

                if (block.caption) {
                  const capText = pick(block.caption, lang);
                  if (capText) {
                    const cap = document.createElement('div');
                    cap.className = 'page-embed-caption';
                    cap.textContent = capText;
                    embedWrap.appendChild(cap);
                  }
                }
              } else {
                const ref = document.createElement('div');
                ref.className = 'page-embed-refused';
                ref.textContent = lang === 'en'
                  ? '⚠️ Embed refused: Only whitelisted platforms (Facebook plugins, YouTube embeds, Google Maps embeds) are permitted.'
                  : (lang === 'ta'
                    ? '⚠️ உட்பொதிவு நிராகரிக்கப்பட்டது: அனுமதிக்கப்பட்ட ஆதாரங்கள் மட்டுமே (Facebook, YouTube, Google Maps).'
                    : '⚠️ කාවැද්දීම ප්‍රතික්ෂේප විය: නිල වශයෙන් අවසරලත් මූලාශ්‍ර (Facebook, YouTube, Google Maps) පමණක් ඇතුළත් කළ හැක.');
                embedWrap.appendChild(ref);
              }

              root.appendChild(embedWrap);
              break;
            }

            default:
              break;
          }
        });
      }

      // Lightbox Handlers
      function openLightbox(images, index) {
        activeGalleryImages = images || [];
        activeGalleryIndex = Math.max(0, Math.min(index, activeGalleryImages.length - 1));
        updateLightboxView();
        const modal = document.getElementById('page-lightbox-modal');
        if (modal) modal.classList.add('open');
      }

      function closeLightbox() {
        const modal = document.getElementById('page-lightbox-modal');
        if (modal) modal.classList.remove('open');
      }

      function updateLightboxView() {
        if (!activeGalleryImages.length) return;
        const lang = getActiveLanguage();
        const currentItem = activeGalleryImages[activeGalleryIndex];
        if (!currentItem) return;

        const img = document.getElementById('lightbox-img-elem');
        if (img) {
          img.src = currentItem.src;
          img.alt = pick(currentItem.alt, lang) || '';
        }

        const cap = document.getElementById('lightbox-caption-elem');
        if (cap) {
          cap.textContent = pick(currentItem.caption, lang) || '';
        }

        const counter = document.getElementById('lightbox-counter-elem');
        if (counter) {
          counter.textContent = `${activeGalleryIndex + 1} / ${activeGalleryImages.length}`;
        }
      }

      function prevLightbox() {
        if (!activeGalleryImages.length) return;
        activeGalleryIndex = (activeGalleryIndex - 1 + activeGalleryImages.length) % activeGalleryImages.length;
        updateLightboxView();
      }

      function nextLightbox() {
        if (!activeGalleryImages.length) return;
        activeGalleryIndex = (activeGalleryIndex + 1) % activeGalleryImages.length;
        updateLightboxView();
      }

      // Setup Lightbox Listeners
      const closeBtn = document.getElementById('lightbox-close-btn');
      if (closeBtn) closeBtn.addEventListener('click', closeLightbox);

      const prevBtn = document.getElementById('lightbox-prev-btn');
      if (prevBtn) prevBtn.addEventListener('click', prevLightbox);

      const nextBtn = document.getElementById('lightbox-next-btn');
      if (nextBtn) nextBtn.addEventListener('click', nextLightbox);

      const modalEl = document.getElementById('page-lightbox-modal');
      if (modalEl) {
        modalEl.addEventListener('click', (e) => {
          if (e.target === modalEl) closeLightbox();
        });
      }

      window.addEventListener('keydown', (e) => {
        if (!modalEl || !modalEl.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') prevLightbox();
        else if (e.key === 'ArrowRight') nextLightbox();
      });

      // Fetch Page JSON
      async function loadCustomPage() {
        if (!slug) {
          showNotFound('missing_slug');
          return;
        }

        // Validate slug characters (alphanumeric, dash, underscore)
        if (!/^[a-zA-Z0-9_-]+$/.test(slug)) {
          showNotFound('invalid_slug');
          return;
        }

        try {
          const res = await fetch(`content/custom-pages/${encodeURIComponent(slug)}.json?_v=1.0`);
          if (!res.ok) {
            showNotFound('not_found');
            return;
          }
          currentPageData = await res.json();
          renderPage();
        } catch (err) {
          console.error('Failed to load custom page:', err);
          showNotFound('error');
        }
      }

      // Re-render on language change
      if (window.i18n && window.i18n.onLanguageChange) {
        window.i18n.onLanguageChange(() => {
          renderPage();
          if (modalEl && modalEl.classList.contains('open')) updateLightboxView();
        });
      }
      window.addEventListener('langchange', () => {
        renderPage();
        if (modalEl && modalEl.classList.contains('open')) updateLightboxView();
      });

      // Initial Load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadCustomPage);
      } else {
        loadCustomPage();
      }
    })();
  </script>
</body>
</html>
