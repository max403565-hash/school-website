<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Us — Mo/Pelwatta Navodya Secondary College</title>
<link rel="icon" href="images/crest.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container breadcrumb" id="breadcrumb"></div>
  <div class="container page-hero">
    <h1 id="page-title"></h1>
    <p id="page-intro"></p>
  </div>

  <section class="section container">
    <div class="card" style="padding:28px;">
      <h2 id="history-title" style="margin-top:0;"></h2>
      <p id="history-body" style="font-size:1.05rem; line-height:1.7; color:var(--text); margin:0;"></p>
    </div>
  </section>

  <section class="section container">
    <div class="card-grid">
      <div class="card" style="padding:24px; border-top:4px solid var(--gold);">
        <div style="font-size:2rem; margin-bottom:10px;">👁️</div>
        <h3 id="vision-title" style="color:var(--maroon); margin-top:0;"></h3>
        <p id="vision-body" style="line-height:1.6; color:var(--text); margin:0;"></p>
      </div>
      <div class="card" style="padding:24px; border-top:4px solid var(--maroon);">
        <div style="font-size:2rem; margin-bottom:10px;">🎯</div>
        <h3 id="mission-title" style="color:var(--maroon); margin-top:0;"></h3>
        <p id="mission-body" style="line-height:1.6; color:var(--text); margin:0;"></p>
      </div>
    </div>
  </section>

  <section class="section container">
    <div class="card" style="padding:28px;">
      <h2 id="principal-title" style="margin-top:0;"></h2>
      <blockquote id="principal-body" style="border-left:4px solid var(--gold); padding-left:20px; color:var(--text); font-size:1.05rem; line-height:1.7; font-style:italic; margin:16px 0 0 0;"></blockquote>
    </div>
  </section>

  <section class="section container">
    <div class="card" style="padding:28px;">
      <h2 id="past-principals-title" style="margin-top:0;"></h2>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; margin-top:16px;" id="past-principals-table"></table>
      </div>
    </div>
  </section>

  <section class="section container">
    <div class="card" style="padding:28px;">
      <h2 id="location-title" style="margin-top:0;"></h2>
      <div class="notice-box warn" id="map-note" style="margin-bottom:18px;"></div>
      <div class="map-embed"><iframe id="map-iframe" loading="lazy" allowfullscreen title="School Map"></iframe></div>
      <div class="map-actions" style="margin-top:18px;"><a class="btn" id="directions-btn" target="_blank" rel="noopener"></a></div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
function renderBody(page, common){
  document.getElementById('breadcrumb').innerHTML = `<a href="index.html">${t(common.nav.home)}</a> / <span>${t(common.nav.about)}</span>`;
  document.getElementById('page-title').textContent = t(common.nav.about);
  document.getElementById('page-intro').textContent = t(page.intro);
  document.getElementById('history-title').textContent = t(page.historyTitle);
  document.getElementById('history-body').textContent = t(page.historyBody);
  document.getElementById('vision-title').textContent = t(page.visionTitle);
  document.getElementById('vision-body').textContent = t(page.visionBody);
  document.getElementById('mission-title').textContent = t(page.missionTitle);
  document.getElementById('mission-body').textContent = t(page.missionBody);
  document.getElementById('principal-title').textContent = t(page.principalMsgTitle);
  document.getElementById('principal-body').textContent = t(page.principalMsgBody);
  document.getElementById('past-principals-title').textContent = t(page.pastPrincipalsTitle);
  document.getElementById('past-principals-table').innerHTML = page.pastPrincipals.map(p=>
    `<tr style="border-bottom:1px solid var(--border)"><td style="padding:12px 10px;font-weight:700;width:160px;color:var(--maroon);">${p.years}</td><td style="padding:12px 10px;color:var(--text);">${p.name}</td></tr>`
  ).join('');
  document.getElementById('location-title').textContent = getLang()==='en'?'Campus Location':(getLang()==='ta'?'பாடசாலை அமைவிடம்':'පාසල් පිහිටීම');
  document.getElementById('map-note').textContent = t(page.mapNote);
  const s = SITE.settings || {};
  const mapEmbed = (s.googleMaps && s.googleMaps.embedUrl) || page.mapEmbedUrl;
  const dirUrl = (s.googleMaps && s.googleMaps.directionsUrl) || page.getDirectionsUrl;
  document.getElementById('map-iframe').src = mapEmbed;
  const dirBtn = document.getElementById('directions-btn');
  dirBtn.href = dirUrl;
  dirBtn.textContent = getLang()==='en'?'🗺️ Get Directions on Google Maps':(getLang()==='ta'?'🗺️ வழிகளைப் பெறுக':'🗺️ ගූගල් සිතියමෙන් මාර්ගය බලන්න');
}
initPage('about', 'content/pages/about.json', renderBody);
</script>
</body>
</html>
