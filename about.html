<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Us — Mo/Pelwatta Navodya Secondary Collage</title>
<link rel="icon" href="images/crest-placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container breadcrumb" id="breadcrumb"></div>
  <div class="container page-hero">
    <h1 id="page-title"></h1>
    <p id="page-intro"></p>
  </div>

  <section class="section container">
    <h2 id="history-title"></h2>
    <p id="history-body"></p>
  </section>

  <section class="section container">
    <div class="card-grid">
      <div class="card"><div class="body"><h3 id="vision-title"></h3><p id="vision-body"></p></div></div>
      <div class="card"><div class="body"><h3 id="mission-title"></h3><p id="mission-body"></p></div></div>
    </div>
  </section>

  <section class="section container">
    <h2 id="principal-title"></h2>
    <blockquote id="principal-body" style="border-left:4px solid var(--orange); padding-left:16px; color:var(--muted)"></blockquote>
  </section>

  <section class="section container">
    <h2 id="past-principals-title"></h2>
    <table style="width:100%; border-collapse:collapse" id="past-principals-table"></table>
  </section>

  <section class="section container">
    <h2 id="location-title"></h2>
    <div class="notice-box warn" id="map-note"></div>
    <div class="map-embed"><iframe id="map-iframe" loading="lazy" allowfullscreen></iframe></div>
    <div class="map-actions"><a class="btn" id="directions-btn" target="_blank" rel="noopener"></a></div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
function renderBody(page, common){
  document.getElementById('breadcrumb').innerHTML = `${t(common.nav.home)} / ${t(common.nav.about)}`;
  document.getElementById('page-title').textContent = t(common.nav.about);
  document.getElementById('page-intro').textContent = t(page.intro);
  document.getElementById('history-title').textContent = t(page.historyTitle);
  document.getElementById('history-body').textContent = t(page.historyBody);
  document.getElementById('vision-title').textContent = t(page.visionTitle);
  document.getElementById('vision-body').textContent = t(page.visionBody);
  document.getElementById('mission-title').textContent = t(page.missionTitle);
  document.getElementById('mission-body').textContent = t(page.missionBody);
  document.getElementById('principal-title').textContent = t(page.principalMsgTitle);
  document.getElementById('principal-body').textContent = t(page.principalMsgBody);
  document.getElementById('past-principals-title').textContent = t(page.pastPrincipalsTitle);
  document.getElementById('past-principals-table').innerHTML = page.pastPrincipals.map(p=>
    `<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 0;font-weight:700;width:140px">${p.years}</td><td style="padding:8px 0">${p.name}</td></tr>`
  ).join('');
  document.getElementById('location-title').textContent = getLang()==='en'?'Location':(getLang()==='ta'?'இருப்பிடம்':'ස්ථානය');
  document.getElementById('map-note').textContent = t(page.mapNote);
  document.getElementById('map-iframe').src = page.mapEmbedUrl;
  const dirBtn = document.getElementById('directions-btn');
  dirBtn.href = page.getDirectionsUrl;
  dirBtn.textContent = getLang()==='en'?'Get Directions':(getLang()==='ta'?'வழிகளைப் பெறுக':'ගමන් මාර්ගය බලන්න');
}
initPage('about', 'content/pages/about.json', renderBody);
</script>
</body>
</html>
