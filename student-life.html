<!DOCTYPE html>
<html lang="si" class="lang-si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Life | ශිෂ්‍ය ජීවිතය - Mo/Pelwatta Navodya Secondary College</title>
  <meta name="description" content="Explore clubs, societies, sports, prefects guild, and student leadership at Mo/Pelwatta Navodya Secondary College." />
  
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Student Life - Mo/Pelwatta Navodya Secondary College" />
  <meta property="og:description" content="Explore clubs, societies, sports, prefects guild, and student leadership at Mo/Pelwatta Navodya Secondary College." />
  <meta property="og:image" content="images/sports-meet.jpg" />

  <link rel="icon" type="image/svg+xml" href="images/crest.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header Root -->
  <div id="site-header-root"></div>

  <!-- Page Banner -->
  <section class="page-banner">
    <div class="container">
      <h1 class="page-title" data-i18n="nav.studentLife">ශිෂ්‍ය ජීවිතය</h1>
      <p class="page-subtitle" id="page-subtitle"></p>
      <div class="breadcrumbs">
        <a href="index.html" data-i18n="nav.home">Home</a> &gt; <span data-i18n="nav.studentLife">Student Life</span>
      </div>
    </div>
  </section>

  <main class="container" style="padding: 3.5rem 1rem;">
    <!-- Sports Section -->
    <div style="margin-bottom: 4rem;">
      <div class="section-header" style="text-align: left;">
        <span class="section-badge" id="sports-badge"></span>
        <h2 class="section-title" id="sports-title"></h2>
        <p class="section-subtitle" style="margin-left: 0;" id="sports-desc"></p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem;" id="sports-grid"></div>
    </div>

    <!-- Clubs and Societies Section -->
    <div style="margin-bottom: 4rem;">
      <div class="section-header" style="text-align: left;">
        <span class="section-badge" id="clubs-badge"></span>
        <h2 class="section-title" id="clubs-title"></h2>
        <p class="section-subtitle" style="margin-left: 0;" id="clubs-desc"></p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem;" id="clubs-grid"></div>
    </div>

    <!-- Prefects Guild -->
    <div>
      <div class="section-header" style="text-align: left;">
        <span class="section-badge" id="prefects-badge"></span>
        <h2 class="section-title" id="prefects-title"></h2>
      </div>

      <div class="card" style="border-left: 4px solid var(--gold); padding:24px;">
        <p style="font-size: 1.05rem; line-height: 1.8; color: var(--navy); margin:0;" id="prefects-body"></p>
      </div>
    </div>
  </main>

  <!-- Footer Root -->
  <div id="site-footer-root"></div>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      let slData = null;

      async function loadData() {
        if (window.i18n && window.i18n.fetchJSON) {
          slData = await window.i18n.fetchJSON('content/student-life.json');
        } else {
          try {
            const res = await fetch('content/student-life.json');
            slData = await res.json();
          } catch (e) {}
        }
        renderContent();
      }

      function renderContent() {
        if (!slData) return;
        const lang = window.i18n ? window.i18n.getLanguage() : 'si';
        const pick = window.i18n ? window.i18n.pickLang : (o => (o && o[lang]) || '');

        if (slData.subtitle) {
          document.getElementById('page-subtitle').textContent = pick(slData.subtitle, lang);
        }
        if (slData.sportsHeader) {
          document.getElementById('sports-badge').textContent = pick(slData.sportsHeader.badge, lang);
          document.getElementById('sports-title').textContent = pick(slData.sportsHeader.title, lang);
          document.getElementById('sports-desc').textContent = pick(slData.sportsHeader.desc, lang);
        }
        if (slData.clubsHeader) {
          document.getElementById('clubs-badge').textContent = pick(slData.clubsHeader.badge, lang);
          document.getElementById('clubs-title').textContent = pick(slData.clubsHeader.title, lang);
          document.getElementById('clubs-desc').textContent = pick(slData.clubsHeader.desc, lang);
        }
        if (slData.prefectsHeader) {
          document.getElementById('prefects-badge').textContent = pick(slData.prefectsHeader.badge, lang);
          document.getElementById('prefects-title').textContent = pick(slData.prefectsHeader.title, lang);
          document.getElementById('prefects-body').textContent = pick(slData.prefectsHeader.body, lang);
        }

        const sportsGrid = document.getElementById('sports-grid');
        sportsGrid.innerHTML = (slData.sports || []).map(sp => `
          <div class="card" style="border-top: 3px solid var(--primary); padding:20px;">
            <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--navy); margin: 0 0 0.5rem 0;">
              ${pick(sp.name, lang)}
            </h3>
            <p style="font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; margin:0;">
              ${pick(sp.desc, lang)}
            </p>
          </div>
        `).join('');

        const clubsGrid = document.getElementById('clubs-grid');
        clubsGrid.innerHTML = (slData.clubs || []).map(cl => `
          <div class="card" style="border-top: 3px solid var(--gold); padding:20px;">
            <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--navy); margin: 0 0 0.5rem 0;">
              ${pick(cl.name, lang)}
            </h3>
            <p style="font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; margin:0;">
              ${pick(cl.desc, lang)}
            </p>
          </div>
        `).join('');
      }

      if (window.i18n && window.i18n.onLanguageChange) {
        window.i18n.onLanguageChange(renderContent);
      }

      loadData();
    })();
  </script>
</body>
</html>
