<!DOCTYPE html>
<html lang="si" class="lang-si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | ඡායාරූප එකතුව | புகைப்படங்கள் - Mo/Pelwatta Navodya Secondary College</title>
  <meta name="description" content="Photo albums and moments of campus life, academics, athletics, and cultural milestones at Mo/Pelwatta Navodya Secondary College." />
  
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Photo Gallery - Mo/Pelwatta Navodya Secondary College" />
  <meta property="og:description" content="Campus facilities, laboratory experiments, sports events, and cultural ceremonies." />
  <meta property="og:image" content="/images/campus-hero.jpg" />

  <link rel="icon" type="image/svg+xml" href="/images/crest.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Header Root -->
  <div id="site-header-root"></div>

  <!-- Page Header Banner -->
  <div class="page-header-banner">
    <div class="container">
      <div class="breadcrumbs">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <span>/</span>
        <span data-i18n="nav.gallery">Gallery</span>
      </div>
      <h1 class="page-banner-title" data-i18n="pages.gallery.title">විද්‍යාලීය ඡායාරූප එකතුව (Photo Gallery)</h1>
      <p class="page-banner-desc" data-i18n="pages.gallery.desc">
        පැල්වත්ත නවෝද්‍යා විදුහල් මාතාවගේ සොඳුරු මතක සටහන්, උත්සව සහ ක්‍රීඩා අවස්ථා
      </p>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container" style="padding-top: 3.5rem; padding-bottom: 4rem;">
    <!-- Album Category Filter -->
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem;" id="album-filter-container">
      <button type="button" class="access-control-btn active" data-album="all" style="font-size:0.875rem; padding:0.4rem 0.875rem;">
        සියලු ඇල්බම (All Albums)
      </button>
      <!-- Populated by JS -->
    </div>

    <!-- Gallery Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;" id="gallery-grid">
      <!-- Populated by JS -->
    </div>

    <!-- Responsive Lightbox Modal -->
    <div class="lightbox-modal" id="lightbox-modal" role="dialog" aria-modal="true" aria-label="Photo View">
      <div class="lightbox-container">
        <button type="button" class="lightbox-close" id="lightbox-close-btn" aria-label="Close photo viewer">&times;</button>
        <button type="button" class="lightbox-prev" id="lightbox-prev-btn" aria-label="Previous photo">&larr;</button>
        <button type="button" class="lightbox-next" id="lightbox-next-btn" aria-label="Next photo">&rarr;</button>
        
        <img src="" alt="" class="lightbox-img" id="lightbox-img" />
        <div class="lightbox-caption" id="lightbox-caption"></div>
      </div>
    </div>
  </main>

  <!-- Footer Root -->
  <div id="site-footer-root"></div>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (function () {
      let galleryData = null;
      let activeAlbum = 'all';
      let currentLightboxIndex = 0;
      let visibleItems = [];

      async function loadData() {
        if (window.i18n && window.i18n.fetchJSON) {
          galleryData = await window.i18n.fetchJSON('content/gallery/index.json');
        } else {
          try {
            const res = await fetch('/content/gallery/index.json');
            galleryData = await res.json();
          } catch (e) {}
        }
        renderContent();
        if (window.i18n && window.i18n.triggerRender) {
          window.i18n.triggerRender();
        }
      }

      function renderContent(forcedLang) {
        if (!galleryData) return;
        const lang = window.i18n ? window.i18n.resolveLang(forcedLang) : 'si';
        const pick = window.i18n ? window.i18n.pickLang : (o => (o && o[lang]) || '');

        // Album Filter Buttons
        const filterContainer = document.getElementById('album-filter-container');
        filterContainer.innerHTML = `
          <button type="button" class="access-control-btn ${activeAlbum === 'all' ? 'active' : ''}" data-album="all" style="font-size:0.875rem; padding:0.4rem 0.875rem;">
            ${lang === 'si' ? 'සියලු ඇල්බම' : (lang === 'ta' ? 'அனைத்து புகைப்படங்கள்' : 'All Albums')}
          </button>
        ` + galleryData.albums.map(alb => `
          <button type="button" class="access-control-btn ${activeAlbum === alb.id ? 'active' : ''}" data-album="${alb.id}" style="font-size:0.875rem; padding:0.4rem 0.875rem;">
            ${pick(alb.name, lang)}
          </button>
        `).join('');

        // Filter items
        visibleItems = activeAlbum === 'all' 
          ? galleryData.items 
          : galleryData.items.filter(item => item.albumId === activeAlbum);

        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = visibleItems.map((item, index) => `
          <div class="news-card" style="cursor: pointer;" data-index="${index}">
            <div class="news-card-img-wrapper" style="aspect-ratio: 4/3;">
              <img src="${item.image}" alt="${pick(item.caption, lang)}" class="news-card-img" loading="lazy" />
            </div>
            <div style="padding: 1rem;">
              <p style="font-size: 0.875rem; color: var(--text-main); line-height: 1.5; font-weight: 500;">
                ${pick(item.caption, lang)}
              </p>
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">
                📅 ${item.date}
              </div>
            </div>
          </div>
        `).join('');

        // Attach Click to open Lightbox
        grid.querySelectorAll('.news-card').forEach(card => {
          card.addEventListener('click', () => {
            const idx = parseInt(card.getAttribute('data-index'), 10);
            openLightbox(idx);
          });
        });

        // Filter button clicks
        filterContainer.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            activeAlbum = btn.getAttribute('data-album');
            renderContent();
          });
        });
      }

      function openLightbox(index) {
        if (!visibleItems[index]) return;
        currentLightboxIndex = index;
        const item = visibleItems[index];
        const lang = window.i18n ? window.i18n.getLanguage() : 'si';
        const pick = window.i18n ? window.i18n.pickLang : (o => (o && o[lang]) || '');

        const modal = document.getElementById('lightbox-modal');
        const img = document.getElementById('lightbox-img');
        const cap = document.getElementById('lightbox-caption');

        img.src = item.image;
        cap.textContent = pick(item.caption, lang);
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        const modal = document.getElementById('lightbox-modal');
        modal.classList.remove('open');
        document.body.style.overflow = '';
      }

      document.getElementById('lightbox-close-btn').addEventListener('click', closeLightbox);
      document.getElementById('lightbox-prev-btn').addEventListener('click', () => {
        if (visibleItems.length === 0) return;
        const newIndex = (currentLightboxIndex - 1 + visibleItems.length) % visibleItems.length;
        openLightbox(newIndex);
      });
      document.getElementById('lightbox-next-btn').addEventListener('click', () => {
        if (visibleItems.length === 0) return;
        const newIndex = (currentLightboxIndex + 1) % visibleItems.length;
        openLightbox(newIndex);
      });

      document.getElementById('lightbox-modal').addEventListener('click', (e) => {
        if (e.target.id === 'lightbox-modal') closeLightbox();
      });

      document.addEventListener('keydown', (e) => {
        if (!document.getElementById('lightbox-modal').classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev-btn').click();
        if (e.key === 'ArrowRight') document.getElementById('lightbox-next-btn').click();
      });

      if (window.i18n && window.i18n.registerPageRenderer) {
        window.i18n.registerPageRenderer(renderContent);
      }
      window.addEventListener('languageChanged', (e) => renderContent(e.detail && e.detail.lang));
      if (window.i18n && window.i18n.whenReady) {
        window.i18n.whenReady().then(() => renderContent());
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadData);
      } else {
        loadData();
      }
    })();
  </script>
</body>
</html>
