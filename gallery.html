<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Mo/Pelwatta Navodya Secondary College</title>
<link rel="icon" href="images/crest.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container breadcrumb" id="breadcrumb"></div>
  <div class="container page-hero">
    <h1 id="page-title"></h1>
    <p id="page-intro"></p>
  </div>
  <section class="section container">
    <input class="search-box" id="search-box" type="search">
    <div class="filters" id="filters"></div>
    <div class="gallery-grid" id="grid"></div>
    <p id="no-results" style="display:none;color:var(--muted)"></p>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
let ALL_ITEMS = [];
let currentCategory = 'all';

function applyFilters(page){
  const q = document.getElementById('search-box').value.trim().toLowerCase();
  const filtered = ALL_ITEMS.filter(item=>{
    const inCategory = currentCategory === 'all' || item.category === currentCategory;
    const caption = t(item.caption).toLowerCase();
    const inSearch = q === '' || caption.includes(q);
    return inCategory && inSearch;
  });
  const grid = document.getElementById('grid');
  const noRes = document.getElementById('no-results');
  if (filtered.length === 0){
    grid.innerHTML = '';
    noRes.style.display = 'block';
    noRes.textContent = t(page.noResults);
  } else {
    noRes.style.display = 'none';
    grid.innerHTML = filtered.map(item=>`
      <figure onclick="openLightbox('${item.image}', '${t(item.caption).replace(/'/g,"\\'")}')">
        <img src="${item.image}" alt="${t(item.caption)}">
        <figcaption>${t(item.caption)}</figcaption>
      </figure>`).join('');
  }
}

function renderBody(page, common){
  document.getElementById('breadcrumb').innerHTML = `${t(common.nav.home)} / ${t(common.nav.gallery)}`;
  document.getElementById('page-title').textContent = t(common.nav.gallery);
  document.getElementById('page-intro').textContent = t(page.intro);
  document.getElementById('search-box').placeholder = t(page.searchPlaceholder);

  const catKeys = Object.keys(page.categories);
  document.getElementById('filters').innerHTML = catKeys.map(k=>
    `<button data-cat="${k}" class="${k===currentCategory?'active':''}">${t(page.categories[k])}</button>`
  ).join('');
  document.querySelectorAll('#filters button').forEach(b=>{
    b.onclick = () => {
      currentCategory = b.dataset.cat;
      document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active', x===b));
      applyFilters(page);
    };
  });

  document.getElementById('search-box').oninput = () => applyFilters(page);

  fetchJSON('content/gallery-items.json').then(items=>{
    ALL_ITEMS = items;
    applyFilters(page);
  });
}
initPage('gallery', 'content/pages/gallery.json', renderBody);
</script>
</body>
</html>
