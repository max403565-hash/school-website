<!DOCTYPE html>
<html lang="si" class="lang-si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy | පෞද්ගලිකත්ව ප්‍රතිපත්තිය - Mo/Pelwatta Navodya Secondary College</title>
  <meta name="description" content="Personal Data Protection Act (PDPA) compliance and data retention policy." />
  
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Privacy Policy - Mo/Pelwatta Navodya Secondary College" />
  <meta property="og:description" content="Personal Data Protection Act (PDPA) compliance and data retention policy." />
  <meta property="og:image" content="images/campus-hero.jpg" />

  <link rel="icon" type="image/svg+xml" href="images/crest.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header Root -->
  <div id="site-header-root"></div>

  <!-- Page Banner -->
  <section class="page-banner">
    <div class="container">
      <h1 class="page-title" data-i18n="footer.privacy">පෞද්ගලිකත්ව ප්‍රතිපත්තිය</h1>
      <p class="page-subtitle" id="priv-subtitle"></p>
      <div class="breadcrumbs">
        <a href="index.html" data-i18n="nav.home">Home</a> &gt; <span data-i18n="footer.privacy">Privacy Policy</span>
      </div>
    </div>
  </section>

  <main class="container" style="padding: 3.5rem 1rem; max-width: 860px;">
    <div class="card" style="padding: 2.5rem 2rem; font-size: 1.05rem; line-height: 1.8; color: var(--navy);">
      <h2 style="font-size: 1.4rem; font-weight: 700; margin-top:0; margin-bottom: 1rem; color: var(--navy);" id="priv-title"></h2>
      <p id="priv-body" style="margin-bottom: 2rem; color:var(--text); line-height:1.7;"></p>

      <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--navy);" id="principles-title"></h3>
      <ul style="list-style: disc; padding-left: 1.5rem; color: var(--text-muted); font-size: 0.95rem; line-height: 1.8; margin:0;" id="principles-list"></ul>
    </div>
  </main>

  <!-- Footer Root -->
  <div id="site-footer-root"></div>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      let legalData = null;

      async function loadData() {
        try {
          if (window.i18n && window.i18n.fetchJSON) {
            legalData = await window.i18n.fetchJSON('content/legal.json');
          } else {
            const res = await fetch('content/legal.json');
            legalData = await res.json();
          }
          renderContent();
        } catch (e) {
          console.error("Failed to load legal content:", e);
        }
      }

      function renderContent() {
        if (!legalData || !legalData.privacyPolicy) return;
        const lang = window.i18n ? window.i18n.getLanguage() : 'si';
        const pick = window.i18n ? window.i18n.pickLang : (o => (o && o[lang]) || '');
        const p = legalData.privacyPolicy;

        if (p.subtitle) {
          document.getElementById('priv-subtitle').textContent = pick(p.subtitle, lang);
        }
        document.getElementById('priv-title').textContent = pick(p.title, lang);
        document.getElementById('priv-body').textContent = pick(p.body, lang);
        if (p.principlesTitle) {
          document.getElementById('principles-title').textContent = pick(p.principlesTitle, lang);
        }
        if (p.principles) {
          document.getElementById('principles-list').innerHTML = p.principles.map(item => `
            <li style="margin-bottom:0.5rem;">${pick(item, lang)}</li>
          `).join('');
        }
      }

      if (window.i18n && window.i18n.onLanguageChange) {
        window.i18n.onLanguageChange(renderContent);
      }

      loadData();
    })();
  </script>
</body>
</html>
