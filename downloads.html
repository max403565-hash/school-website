<!DOCTYPE html>
<html lang="si" class="lang-si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloads & Circulars | චක්‍රලේඛ සහ බාගත කිරීම් - Mo/Pelwatta Navodya Secondary College</title>
  <meta name="description" content="Download academic calendars, exam timetables, admission forms, and Ministry of Education circulars from Mo/Pelwatta Navodya Secondary College." />
  
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Downloads & Circulars - Mo/Pelwatta Navodya Secondary College" />
  <meta property="og:description" content="Official downloadable documents and government circulars." />
  <meta property="og:image" content="/images/campus-hero.jpg" />

  <link rel="icon" type="image/svg+xml" href="/images/crest.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Header Root -->
  <div id="site-header-root"></div>

  <!-- Page Header Banner -->
  <div class="page-header-banner">
    <div class="container">
      <div class="breadcrumbs">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <span>/</span>
        <span data-i18n="footer.downloads">Downloads & Circulars</span>
      </div>
      <h1 class="page-banner-title" data-i18n="pages.downloads.title">චක්‍රලේඛ සහ බාගත කිරීම් (Downloads & Circulars)</h1>
      <p class="page-banner-desc" data-i18n="pages.downloads.desc">
        විභාග කාලසටහන්, පාසල් දින දර්ශන, අයදුම්පත් ආකෘති සහ අමාත්‍යාංශ චක්‍රලේඛ
      </p>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container" style="padding-top: 3.5rem; padding-bottom: 4rem;">
    <!-- Filter and Search -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="dl-category-container">
        <!-- Populated by JS -->
      </div>
      <div style="width: 100%; max-width: 300px;">
        <input 
          type="text" 
          id="dl-search-input" 
          placeholder="සොයන්න / Search files..." 
          data-i18n-attr="placeholder:pages.downloads.searchPlaceholder"
          class="form-input" 
          style="padding: 0.5rem 0.875rem;" 
        />
      </div>
    </div>

    <!-- Downloads Table -->
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 45%;" data-i18n="pages.downloads.thTitle">ලේඛනයේ නම (Document Title)</th>
            <th style="width: 18%;" data-i18n="pages.downloads.thCategory">කාණ්ඩය (Category)</th>
            <th style="width: 15%;" data-i18n="pages.downloads.thDate">දිනය (Date)</th>
            <th style="width: 12%;" data-i18n="pages.downloads.thSize">ප්‍රමාණය (Size)</th>
            <th style="width: 10%; text-align: center;" data-i18n="pages.downloads.thAction">බාගත කිරීම</th>
          </tr>
        </thead>
        <tbody id="downloads-table-body">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Footer Root -->
  <div id="site-footer-root"></div>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (function () {
      let dlData = null;
      let activeCat = 'all';
      let searchQuery = '';

      async function loadData() {
        try {
          if (window.i18n && window.i18n.fetchJSON) {
            dlData = await window.i18n.fetchJSON('content/downloads/index.json');
          } else {
            const res = await fetch('/content/downloads/index.json');
            dlData = await res.json();
          }
          renderContent();
          if (window.i18n && window.i18n.triggerRender) {
            window.i18n.triggerRender();
          }
        } catch (e) {
          console.error("Error loading downloads:", e);
        }
      }

      function renderContent(forcedLang) {
        if (!dlData) return;
        const lang = window.i18n ? window.i18n.resolveLang(forcedLang) : 'si';
        const pick = window.i18n ? window.i18n.pickLang : (o => (o && o[lang]) || '');

        // Category filter buttons
        const catContainer = document.getElementById('dl-category-container');
        catContainer.innerHTML = dlData.categories.map(cat => `
          <button type="button" class="access-control-btn ${activeCat === cat.id ? 'active' : ''}" data-cat="${cat.id}" style="font-size:0.875rem; padding:0.4rem 0.875rem;">
            ${pick(cat.label, lang)}
          </button>
        `).join('');

        let filtered = dlData.files;
        if (activeCat !== 'all') {
          filtered = filtered.filter(f => f.category === activeCat);
        }
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          filtered = filtered.filter(f => {
            const title = (pick(f.title, lang) || '').toLowerCase();
            return title.includes(q) || f.filename.toLowerCase().includes(q);
          });
        }

        const tbody = document.getElementById('downloads-table-body');
        if (filtered.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" style="text-align:center; padding:2rem; color:var(--text-muted);">
                ${lang === 'si' ? 'අදාළ ලේඛන හමු නොවීය.' : (lang === 'ta' ? 'ஆவணங்கள் எதுவும் இல்லை.' : 'No matching documents found.')}
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = filtered.map(file => `
          <tr>
            <td>
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="color:#DC2626; font-size:1.25rem;">📄</span>
                <div>
                  <strong style="color:var(--navy); font-size:0.9375rem; display:block;">${pick(file.title, lang)}</strong>
                  <span style="font-size:0.75rem; color:var(--text-muted); font-family:monospace;">${file.filename}</span>
                </div>
              </div>
            </td>
            <td style="text-transform:capitalize; color:var(--text-muted); font-weight:500;">
              ${file.category}
            </td>
            <td style="color:var(--text-muted); font-variant-numeric:tabular-nums;">
              ${file.date}
            </td>
            <td style="color:var(--text-muted); font-variant-numeric:tabular-nums;">
              ${file.size}
            </td>
            <td style="text-align:center;">
              <a href="/downloads/${file.filename}" download class="btn-primary" style="padding:0.35rem 0.75rem; font-size:0.75rem;" title="Download PDF">
                <span>⬇️</span>
              </a>
            </td>
          </tr>
        `).join('');

        catContainer.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            activeCat = btn.getAttribute('data-cat');
            renderContent();
          });
        });
      }

      document.getElementById('dl-search-input').addEventListener('input', e => {
        searchQuery = e.target.value;
        renderContent();
      });

      if (window.i18n && window.i18n.registerPageRenderer) {
        window.i18n.registerPageRenderer(renderContent);
      }
      window.addEventListener('languageChanged', (e) => renderContent(e.detail && e.detail.lang));
      if (window.i18n && window.i18n.whenReady) {
        window.i18n.whenReady().then(() => renderContent());
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadData);
      } else {
        loadData();
      }
    })();
  </script>
</body>
</html>
