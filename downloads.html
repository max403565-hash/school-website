<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloads — Mo/Pelwatta Navodya Secondary Collage</title>
<link rel="icon" href="images/crest-placeholder.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container breadcrumb" id="breadcrumb"></div>
  <div class="container page-hero"><h1 id="page-title"></h1></div>
  <section class="section container">
    <ul id="list" style="list-style:none;padding:0"></ul>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/app.js"></script>
<script>
const TITLE = {si:"බාගත කිරීම් / චක්‍රලේඛ",ta:"பதிவிறக்கங்கள் / சுற்றறிக்கைகள்",en:"Downloads / Circulars"};
function renderBody(){
  document.getElementById('breadcrumb').innerHTML = `${t(SITE.common.nav.home)} / ${t(TITLE)}`;
  document.getElementById('page-title').textContent = t(TITLE);
  fetchJSON('content/pages/academic.json').then(a=>{
    document.getElementById('list').innerHTML = a.downloads.map(d=>
      `<li style="padding:10px 0;border-bottom:1px solid var(--border)"><a href="${d.file}" download>&#128190; ${t(d.label)}</a></li>`
    ).join('');
  });
}
initPage('downloads', null, renderBody);
</script>
</body>
</html>
